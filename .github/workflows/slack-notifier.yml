name: "afv-library PR Slack Notifier (Block Kit)"

on:
  pull_request:
    types: [opened, reopened]

jobs:
  pr-slack-notify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: "Fetch Details and Post to Slack"
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const https = require('https');
            const pr = context.payload.pull_request;

            // Stats from the PR context
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changedFiles = pr.changed_files;
            const headBranch = pr.head.ref;
            const baseBranch = pr.base.ref;

            // Calculate PR size and color
            const totalChanges = additions + deletions;
            let prSize, color;
            if (totalChanges < 100) {
              prSize = "Small";
              color = "#36a64f"; // Green
            } else if (totalChanges < 500) {
              prSize = "Medium";
              color = "#ff9900"; // Orange
            } else {
              prSize = "Large";
              color = "#ff0000"; // Red
            }

            // Determine emoji based on PR size
            let sizeEmoji;
            if (prSize === "Small") sizeEmoji = "🟢";
            else if (prSize === "Medium") sizeEmoji = "🟡";
            else sizeEmoji = "🔴";

            // Build Block Kit payload
            const payload = {
              attachments: [
                {
                  color: color,
                  blocks: [
                    {
                      type: "header",
                      text: {
                        type: "plain_text",
                        text: "🚀 Pull Request Opened",
                        emoji: true
                      }
                    },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: `*<${pr.html_url}|${pr.title}>*`
                      }
                    },
                    {
                      type: "divider"
                    },
                    {
                      type: "section",
                      fields: [
                        {
                          type: "mrkdwn",
                          text: `👤 *Author*\n<${pr.user.html_url}|@${pr.user.login}>`
                        },
                        {
                          type: "mrkdwn",
                          text: `${sizeEmoji} *Size*\n${prSize} • ${totalChanges} changes`
                        }
                      ]
                    },
                    {
                      type: "section",
                      fields: [
                        {
                          type: "mrkdwn",
                          text: `🔀 *Merge Route*\n\`${headBranch}\` → \`${baseBranch}\``
                        },
                        {
                          type: "mrkdwn",
                          text: `📊 *Changes*\n${changedFiles} files • +${additions} −${deletions}`
                        }
                      ]
                    },
                    {
                      type: "divider"
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "👀 Review PR",
                            emoji: true
                          },
                          url: pr.html_url,
                          style: "primary"
                        },
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "📁 View Files",
                            emoji: true
                          },
                          url: `${pr.html_url}/files`
                        }
                      ]
                    },
                    {
                      type: "context",
                      elements: [
                        {
                          type: "mrkdwn",
                          text: `📦 ${pr.base.repo.name} • <!date^${Math.floor(new Date(pr.created_at).getTime() / 1000)}^{date_short_pretty} at {time}|${pr.created_at}>`
                        }
                      ]
                    }
                  ]
                }
              ]
            };

            // Send to Slack
            const url = new URL(process.env.SLACK_WEBHOOK_URL);
            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };

            const req = https.request(options, (res) => {
              let responseBody = '';
              res.on('data', (chunk) => {
                responseBody += chunk;
              });
              res.on('end', () => {
                if (res.statusCode === 200) {
                  console.log('✅ Slack notification sent successfully');
                } else {
                  console.error(`❌ Slack returned status ${res.statusCode}: ${responseBody}`);
                }
              });
            });

            req.on('error', (e) => {
              console.error('❌ Failed to send Slack notification:', e);
              throw e;
            });

            req.write(JSON.stringify(payload));
            req.end();
