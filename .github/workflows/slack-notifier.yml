name: "PR Slack Notifier"

on:
  pull_request:
    types: [opened, reopened]

jobs:
  pr-slack-notify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: "Fetch Details and Post to Slack"
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const https = require('https');
            const pr = context.payload.pull_request;

            // Stats from the context
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changedFiles = pr.changed_files;
            const headBranch = pr.head.ref;
            const baseBranch = pr.base.ref;

            // Extract GUS work item from PR title or body
            const gusPattern = /W-\d{8}/i;
            const titleMatch = pr.title.match(gusPattern);
            const bodyMatch = pr.body ? pr.body.match(gusPattern) : null;
            const gusWorkItem = titleMatch ? titleMatch[0] : (bodyMatch ? bodyMatch[0] : null);

            // Build GUS link if work item found
            let gusText = '';
            if (gusWorkItem) {
              const gusUrl = `https://gus.lightning.force.com/lightning/r/ADM_Work__c/${gusWorkItem}/view`;
              gusText = `\n*GUS:* <${gusUrl}|${gusWorkItem}>`;
            }

            // Build Block Kit payload with original style
            const payload = {
              attachments: [
                {
                  color: "#9CA3AF",
                  blocks: [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: `:pr: *Pull Request Opened*\n*Title:* <${pr.html_url}|${pr.title}>\n*Author:* <${pr.user.html_url}|${pr.user.login}>${gusText}`
                      }
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "Review PR"
                          },
                          url: pr.html_url,
                          style: "primary"
                        },
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "View Files"
                          },
                          url: `${pr.html_url}/files`
                        }
                      ]
                    }
                  ]
                }
              ]
            };

            // Send to Slack
            const url = new URL(process.env.SLACK_WEBHOOK_URL);
            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            };

            const req = https.request(options, (res) => {
              let responseBody = '';
              res.on('data', (chunk) => {
                responseBody += chunk;
              });
              res.on('end', () => {
                if (res.statusCode === 200) {
                  console.log('✅ Slack notification sent successfully');
                } else {
                  console.error(`❌ Slack returned status ${res.statusCode}: ${responseBody}`);
                }
              });
            });

            req.on('error', (e) => {
              console.error('❌ Failed to send Slack notification:', e);
              throw e;
            });

            req.write(JSON.stringify(payload));
            req.end();
